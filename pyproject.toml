[project]
name = "python-agent"
version = "0.1.0"
description = "学习 Claude Code 架构的 Python Agent 实现"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "lcl" }
]

dependencies = [
    "anthropic>=0.42.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
